name: Excel Masters Community AI Bot

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  auto-assign-and-triage:
    name: Auto-assign, Label & Welcome
    runs-on: ubuntu-latest
    steps:
      - name: Auto-assign Issue to Lead Maintainer
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = context.issue.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const author = context.payload.issue.user.login;

            // Auto-assign issue to Kukzze
            try {
              await github.rest.issues.addAssignees({
                owner,
                repo,
                issue_number: issueNumber,
                assignees: ['Kukzze']
              });
            } catch (err) {
              console.log('Assignee error:', err.message);
            }

            // Add triage and community labels
            try {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: issueNumber,
                labels: ['triage', 'community']
              });
            } catch (err) {
              console.log('Labels error:', err.message);
            }

            // Post welcoming AI assistant response
            const commentBody = `👋 **Hi @${author}! Welcome to [Excel Masters](https://www.excelmasters.in/)!**\n\n` +
              `Thank you for reaching out. Your issue has been logged, tagged for \`triage\`, and auto-assigned to core maintainer @Kukzze for review.\n\n` +
              `### ⚡ Quick Community Links:\n` +
              `- 🌐 **Official Web Platform**: [excelmasters.in](https://www.excelmasters.in/)\n` +
              `- 💬 **Discord Server**: [Join our Discord](https://discord.gg/7vaHhewmtJ) for real-time community chat and formula help\n` +
              `- 📚 **Curated Resources**: Interactive course modules, formula cheat sheets, and workflow automation templates\n\n` +
              `> *If this is a bug report or formula tooling request, please make sure to include any sample data or screenshots above so we can help quickly.*\n\n` +
              `— *Excel Masters Community Bot 🤖*`;

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issueNumber,
              body: commentBody
            });

      - name: Welcome Pull Request Contributor
        if: github.event_name == 'pull_request_target'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.issue.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const author = context.payload.pull_request.user.login;

            // Add triage and PR labels
            try {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: prNumber,
                labels: ['triage', 'pull-request']
              });
            } catch (err) {
              console.log('Labels error:', err.message);
            }

            const commentBody = `🚀 **Thank you for contributing to Excel Masters, @${author}!**\n\n` +
              `We appreciate your pull request. Our automated CI checks are currently evaluating your branch.\n\n` +
              `### 📋 Contributor Pre-Flight Checklist:\n` +
              `- [ ] Branch is synced with \`main\`\n` +
              `- [ ] All automated CI checks pass without errors\n` +
              `- [ ] Documentation or templates updated where applicable\n\n` +
              `Maintainer @Kukzze will review your pull request shortly. Happy building!\n\n` +
              `— *Excel Masters Automation ⚡*`;

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: prNumber,
              body: commentBody
            });
